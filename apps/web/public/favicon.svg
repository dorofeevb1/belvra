<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6B21A8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Letter B in white, serif style -->
  <text x="16" y="23"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="bold"
        text-anchor="middle" fill="white">
    B
  </text>

  <!-- Small flourish on the B -->
  <path d="M9.5 8.5 Q7 8 6.5 10.5 Q6.2 12.5 8 13.2"
        fill="none" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
</svg>