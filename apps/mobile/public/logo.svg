<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6B21A8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Main wordmark using web-safe serif stack -->
  <text x="30" y="36"
        font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif"
        font-size="34" font-weight="normal" letter-spacing="4"
        fill="url(#brandGrad)">
    Belvra
  </text>

  <!-- Decorative flourish curving from the B stem -->
  <path d="M28 13 Q20 11 18 17 Q17 21 21 22.5"
        fill="none" stroke="url(#accentGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

  <!-- Small elegant leaf accent nestled at the v -->
  <path d="M108 14 Q112 7 118 9.5 Q113 11.5 111.5 16 Q109.5 11.5 108 14 Z"
        fill="#A855F7" opacity="0.5"/>
  <!-- Leaf vein -->
  <path d="M113 10 Q112 13 111.5 15" fill="none" stroke="#6B21A8" stroke-width="0.5" opacity="0.35"/>

  <!-- Subtle underline accent -->
  <line x1="32" y1="41" x2="162" y2="41"
        stroke="url(#brandGrad)" stroke-width="0.7" opacity="0.25"/>
</svg>