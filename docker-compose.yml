services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: beautystyle_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beautystyle}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beautystyle_network

  # Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: beautystyle_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beautystyle_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: beautystyle_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:z
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=development
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-beautystyle}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:80,http://localhost
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - beautystyle_network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: beautystyle_frontend
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    networks:
      - beautystyle_network

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: beautystyle_celery
    command: celery -A config worker -l INFO
    volumes:
      - ./backend:/app:z
    environment:
      - DJANGO_ENV=development
      - POSTGRES_DB=${POSTGRES_DB:-beautystyle}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - db
      - redis
      - backend
    networks:
      - beautystyle_network

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: beautystyle_celery_beat
    command: celery -A config beat -l INFO
    volumes:
      - ./backend:/app:z
    environment:
      - DJANGO_ENV=development
      - POSTGRES_DB=${POSTGRES_DB:-beautystyle}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - db
      - redis
      - celery
    networks:
      - beautystyle_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: beautystyle_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - beautystyle_network

  # Ollama - Local AI for image analysis
  ollama:
    image: ollama/ollama:latest
    container_name: beautystyle_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - beautystyle_network

  # Flower - Celery monitoring
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: beautystyle_flower
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - DJANGO_ENV=development
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
      - celery
    networks:
      - beautystyle_network

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  ollama_data:

networks:
  beautystyle_network:
    driver: bridge
