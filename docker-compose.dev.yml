services:
  # PostgreSQL Database (dev)
  db:
    image: postgres:16-alpine
    container_name: beautystyle_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - beautystyle_network_dev

  # Redis (dev)
  redis:
    image: redis:7-alpine
    container_name: beautystyle_redis_dev
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - beautystyle_network_dev

  # Django Backend (dev)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beautystyle_backend_dev
    volumes:
      - backend_static_dev:/app/staticfiles
      - backend_media_dev:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_ENV=development
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - SECURE_SSL_REDIRECT=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - beautystyle_network_dev

  # Angular Frontend Builder (dev)
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: beautystyle_frontend_dev
    volumes:
      - frontend_dist_dev:/out
    restart: "no"

  # Celery Worker (dev)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beautystyle_celery_dev
    command: celery -A config worker -l INFO --concurrency=2
    env_file:
      - .env
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
    depends_on:
      - db
      - redis
      - backend
    restart: always
    networks:
      - beautystyle_network_dev

  # Celery Beat (dev)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beautystyle_celery_beat_dev
    command: celery -A config beat -l INFO
    env_file:
      - .env
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
    depends_on:
      - db
      - redis
      - celery
    restart: always
    networks:
      - beautystyle_network_dev

  # Nginx (dev) - port 8080
  nginx:
    image: nginx:alpine
    container_name: beautystyle_nginx_dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static_dev:/var/www/static:ro
      - backend_media_dev:/var/www/media:ro
      - frontend_dist_dev:/var/www/frontend:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - beautystyle_network_dev

volumes:
  postgres_data_dev:
  redis_data_dev:
  backend_static_dev:
  backend_media_dev:
  frontend_dist_dev:

networks:
  beautystyle_network_dev:
    driver: bridge
