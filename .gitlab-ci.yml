stages:
  - test
  - deploy

variables:
  COMPOSE_FILE: docker-compose.prod.yml
  REMOTE_DIR: /opt/beautystyle

# --- Test Stage ---
backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: beautystyle_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  before_script:
    - apt-get update && apt-get install -y libpq-dev gcc
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py test --noinput --settings=config.settings.base
  only:
    - master
    - merge_requests

# --- Deploy Stage ---
deploy-prod:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 37.77.104.201 >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "=== Деплой на продакшен ==="

    # 1. Синхронизация кода
    - >
      rsync -avz --delete
      --exclude=node_modules
      --exclude=.git
      --exclude=__pycache__
      --exclude='*.pyc'
      --exclude=dist
      --exclude=.angular
      --exclude=.env
      --exclude=.env.prod
      --exclude=celerybeat-schedule
      -e ssh ./ root@37.77.104.201:${REMOTE_DIR}/

    # 2. Восстанавливаем .env
    - ssh root@37.77.104.201 "cd ${REMOTE_DIR} && cp .env.prod .env"

    # 3. Сборка контейнеров
    - ssh root@37.77.104.201 "cd ${REMOTE_DIR} && docker compose -f ${COMPOSE_FILE} build"

    # 4. Перезапуск
    - ssh root@37.77.104.201 "cd ${REMOTE_DIR} && docker compose -f ${COMPOSE_FILE} down && docker compose -f ${COMPOSE_FILE} up -d"

    # 5. Миграции + статика
    - >
      ssh root@37.77.104.201 "cd ${REMOTE_DIR} && sleep 5 &&
      docker compose -f ${COMPOSE_FILE} exec -T backend python manage.py migrate --noinput &&
      docker compose -f ${COMPOSE_FILE} exec -T backend python manage.py collectstatic --noinput"

    # 6. Проверка
    - ssh root@37.77.104.201 "curl -sf http://localhost/ > /dev/null && echo 'Frontend OK' || echo 'Frontend FAIL'"
    - ssh root@37.77.104.201 "curl -sf http://localhost/api/v1/services/categories/ > /dev/null && echo 'API OK' || echo 'API FAIL'"
  only:
    - master
  when: manual
  environment:
    name: production
    url: http://37.77.104.201
