stages:
  - test
  - deploy-dev
  - deploy-prod

variables:
  REMOTE_DIR_DEV: /opt/belvra/dev
  REMOTE_DIR_PROD: /opt/belvra/prod
  DEPLOY_SERVER: root@89.223.126.31

# ============================================================
# Test Stage — backend and frontend run in parallel
# ============================================================

backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: belvra_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  before_script:
    - apt-get update && apt-get install -y libpq-dev gcc
    - pip install --cache-dir=.pip-cache -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py test --noinput --settings=config.settings.base
  only:
    - master
    - merge_requests

frontend-build:
  stage: test
  image: node:20-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - apps/web/node_modules/
  before_script:
    - cd apps/web
    - npm install
  script:
    - npx ng build --configuration=production
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  only:
    - master
    - merge_requests

# ============================================================
# Deploy Dev — automatic after tests pass
# ============================================================

.deploy-template: &deploy_template
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 89.223.126.31 >> ~/.ssh/known_hosts 2>/dev/null

deploy-dev:
  stage: deploy-dev
  image: alpine:3.20
  <<: *deploy_template
  script:
    - echo "=== Деплой на DEV ==="

    # 1. Создаём директорию если не существует
    - ssh ${DEPLOY_SERVER} "mkdir -p ${REMOTE_DIR_DEV}"

    # 2. Синхронизация кода
    - >
      rsync -avz --delete
      --exclude=node_modules
      --exclude=.git
      --exclude=__pycache__
      --exclude='*.pyc'
      --exclude=dist
      --exclude=.angular
      --exclude=.env
      --exclude=.env.prod
      --exclude=.env.dev
      --exclude=celerybeat-schedule
      -e ssh ./ ${DEPLOY_SERVER}:${REMOTE_DIR_DEV}/

    # 3. Восстанавливаем .env
    - ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_DEV} && cp .env.dev .env"

    # 4. Сборка контейнеров
    - ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_DEV} && docker compose -f docker-compose.dev.yml build"

    # 5. Перезапуск
    - ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_DEV} && docker compose -f docker-compose.dev.yml down && docker compose -f docker-compose.dev.yml up -d"

    # 6. Миграции + статика
    - >
      ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_DEV} && sleep 5 &&
      docker compose -f docker-compose.dev.yml exec -T backend python manage.py migrate --noinput &&
      docker compose -f docker-compose.dev.yml exec -T backend python manage.py collectstatic --noinput"

    # 7. Проверка
    - ssh ${DEPLOY_SERVER} "curl -sf http://localhost:8080/ > /dev/null && echo 'DEV Frontend OK' || echo 'DEV Frontend FAIL'"
    - ssh ${DEPLOY_SERVER} "curl -sf http://localhost:8080/api/v1/services/categories/ > /dev/null && echo 'DEV API OK' || echo 'DEV API FAIL'"
  needs:
    - backend-test
    - frontend-build
  only:
    - master
  environment:
    name: development
    url: http://89.223.126.31:8080

# ============================================================
# Deploy Prod — manual, after dev is verified
# ============================================================

deploy-prod:
  stage: deploy-prod
  image: alpine:3.20
  <<: *deploy_template
  script:
    - echo "=== Деплой на PROD ==="

    # 1. Создаём директорию если не существует
    - ssh ${DEPLOY_SERVER} "mkdir -p ${REMOTE_DIR_PROD}"

    # 2. Синхронизация кода
    - >
      rsync -avz --delete
      --exclude=node_modules
      --exclude=.git
      --exclude=__pycache__
      --exclude='*.pyc'
      --exclude=dist
      --exclude=.angular
      --exclude=.env
      --exclude=.env.prod
      --exclude=.env.dev
      --exclude=celerybeat-schedule
      --exclude=ssl
      -e ssh ./ ${DEPLOY_SERVER}:${REMOTE_DIR_PROD}/

    # 3. Восстанавливаем .env
    - ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_PROD} && cp .env.prod .env"

    # 4. Сборка контейнеров
    - ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_PROD} && docker compose -f docker-compose.prod.yml build"

    # 5. Перезапуск
    - ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_PROD} && docker compose -f docker-compose.prod.yml down && docker compose -f docker-compose.prod.yml up -d"

    # 6. Миграции + статика
    - >
      ssh ${DEPLOY_SERVER} "cd ${REMOTE_DIR_PROD} && sleep 5 &&
      docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput &&
      docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput"

    # 7. Проверка
    - ssh ${DEPLOY_SERVER} "curl -sf http://localhost/ > /dev/null && echo 'PROD Frontend OK' || echo 'PROD Frontend FAIL'"
    - ssh ${DEPLOY_SERVER} "curl -sf http://localhost/api/v1/services/categories/ > /dev/null && echo 'PROD API OK' || echo 'PROD API FAIL'"
  needs:
    - deploy-dev
  only:
    - master
  when: manual
  environment:
    name: production
    url: http://89.223.126.31
